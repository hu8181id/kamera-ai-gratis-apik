name: Build Kamera AI Gratis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true

jobs:
  build-android:
    name: Build Android standalone APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP source tidak ditemukan di root repository."
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/.build-source"
          mkdir -p "$GITHUB_WORKSPACE/.build-source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.build-source"
          PACKAGE_JSON="$(find "$GITHUB_WORKSPACE/.build-source" -type f -name package.json -not -path '*/node_modules/*' | head -n 1 || true)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json tidak ditemukan di dalam ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project if needed
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f android/gradlew ]; then
            npx expo prebuild --platform android --no-install --non-interactive
          fi

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x ./gradlew

      - name: Build standalone release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamera-ai-gratis-standalone-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
